global:
  environment: production
  imagePullSecrets: []

backend:
  replicaCount: 3
  image:
    repository: ghcr.io/chandravamsi09/atlas/backend
    tag: "v1.0.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
  resources:
    limits:
      cpu: 4000m
      memory: 8Gi
    requests:
      cpu: 1000m
      memory: 2Gi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 75

frontend:
  replicaCount: 2
  image:
    repository: ghcr.io/chandravamsi09/atlas/frontend
    tag: "v1.0.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000

postgres:
  enabled: true
  persistence:
    size: 200Gi

redis:
  enabled: true
  cluster:
    enabled: true

name: Atlas Continuous Integration

on:
  push:
    branches: [ main, develop, 'release/*' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-typecheck:
    name: Code Quality & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy
      - name: Run Ruff Linter
        run: ruff check .
      - name: Run Mypy Type Checker
        run: mypy backend/app/ --ignore-missing-imports

  backend-tests:
    name: Backend Test Suites (Unit, Integration, RAG, Security)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas_password
          POSTGRES_DB: atlas_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Run Unit Tests
        run: pytest tests/unit/ -v --cov=backend/app --cov-report=xml
      - name: Run Integration Tests
        run: pytest tests/integration/ -v
        env:
          DATABASE_URL: postgresql+asyncpg://atlas:atlas_password@localhost:5432/atlas_db
          REDIS_URL: redis://localhost:6379/0
      - name: Run Evaluation Benchmark Tests
        run: pytest tests/evaluation/ -v
      - name: Run Security & OWASP Tests
        run: pytest tests/security/ -v

  frontend-build:
    name: Frontend Build & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package.json
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci || npm install
      - name: Build Next.js Application
        working-directory: ./frontend
        run: npm run build --if-present
